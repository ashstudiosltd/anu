<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101012"><title>Anu — Reconnect</title><style>
:root{color-scheme:light dark;--bg:#fff;--fg:#211d29;--muted:#403a49;--line:#21182c45;--accent:#8060c2}@media(prefers-color-scheme:dark){:root{--bg:#101012;--fg:#f5f3fc;--muted:#e5e3e9;--line:#ffffff60;--accent:#b49af5}}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:32px 24px;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:Roboto,system-ui,sans-serif}main{max-width:390px;text-align:center}.mark{display:inline-flex;align-items:center;gap:11px;margin-bottom:32px;font-size:42px;font-weight:700;letter-spacing:-3px}.dot{width:24px;height:24px;border-radius:50%;background:var(--accent)}.period{color:var(--accent)}h1{font-size:26px;font-weight:500;letter-spacing:-.7px;margin:0 0 14px}p{color:var(--muted);font-size:15px;line-height:1.7;margin:0 0 26px}a{display:inline-flex;padding:12px 22px;border:1px solid var(--line);border-radius:99px;color:var(--fg);text-decoration:none;font-size:14px;font-weight:600}a:hover{border-color:var(--accent)}a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
</style></head><body><main><div class="mark" aria-label="Anu"><span class="dot" aria-hidden="true"></span><span>anu<span class="period">.</span></span></div><h1>A little pause.</h1><p>You’re offline. Reconnect to keep talking with Anu.</p><a href="/">Try again</a></main></body></html>
